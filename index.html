<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de cores</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Paleta de cores</h1>
    <div id="tela-de-pintura"></div>
    <h3></h3>
    <p>Clique em uma das cores abaixo para pintar a tela</p>

    <div id="paleta">
        <div id="pincel-vermelho" class="pincel" style="background-color: rgb(189, 10, 10);"></div>
        
        <div id="pincel-laranja" class="pincel" style="background-color: rgb(216, 124, 3);"></div>

        <div id="pincel-amarelo" class="pincel" style="background-color: rgb(252, 239, 136);"></div>

        <div id="pincel-verde" class="pincel" style="background-color: rgb(0, 120, 0);"></div>

        <div id="pincel-azul" class="pincel" style="background-color: rgb(69, 69, 225);"></div>

        <div id="pincel-azulescuro" class="pincel" style="background-color: rgb(2, 2, 112);"></div>

        <div id="pincel-roxo" class="pincel" style="background-color: rgb(120, 6, 120);"></div>

        <div id="pincel-rosa" class="pincel" style="background-color: rgb(216, 112, 147);"></div>

        <div id="pincel-pink" class="pincel" style="background-color: rgb(249, 31, 126);"></div>
    </div>

<script src="script.js"></script>
</body>
</html>
